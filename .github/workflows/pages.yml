name: Publish Widget

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "widget/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static artifact
        run: |
          mkdir -p public
          cp -R site/. public/
          cp widget/dist/ai-chat.js public/ai-chat.js
          cp widget/dist/ai-chat.css public/ai-chat.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
